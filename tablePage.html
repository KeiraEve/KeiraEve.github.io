<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tables</title>
</head>
<body>
    <table>
        <caption>Office Hours</caption>
        <thead>
            <tr>
                <th scope="col">Day</th>
                <th scope="col">Time</th>
                <th scope="col">Location</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mon</td>
                <td>2-4pm</td>
                <td>RB304</td>
            </tr>
        </tbody>
    </table>

    <table>
        <caption>Fun Table</caption>
        <thead>
            <tr>
                <th scope="col">Color</th>
                <th scope="col">Year</th>
                <th scope="col">Sound</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Pink</td>
                <td>2007</td>
                <td>boing</td>
            </tr>
            <tr>
                <td>Chartreuse</td>
                <td>1999</td>
                <td>sploink</td>
            </tr>
            <tr>
                <td>Plum</td>
                <td>1977</td>
                <td>fwung</td>
            </tr>
            <tr>
                <td>Black</td>
                <td>2011</td>
                <td>shwoom</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
