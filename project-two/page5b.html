<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/project-two-style.css">
    <title>The Path of Stealth</title>
</head>

<body>

    <section class="container">
        <h1>The Path of Stealth</h1>
        <p>To successfully navigate the Path of Stealth, you must choose your actions carefully. Select the correct
            sequence of actions to avoid detection and reach your objective.</p>
        <p id="pressed"></p>
        <!-- Actions -->
        <div onclick="selectAction('hide'); onChoice(this)" class="stealth-option">Hide in the shadows</div>
        <div onclick="selectAction('run'); onChoice(this)" class="stealth-option">Run quickly to the next cover</div>
        <div onclick="selectAction('distract'); onChoice(this)" class="stealth-option">Create a distraction</div>
        <div onclick="selectAction('wait'); onChoice(this)" class="stealth-option">Wait for the right moment</div>
        <!-- Buttons -->
        <button onclick="checkSequence()">Check Sequence</button>
        <button onclick="reset()">Reset!</button>
    </section>

    <script>
        const correctSequence = ['hide', 'wait', 'distract', 'run'];
        // Your Code here
        let currentSequence = [];
        let choiceText = document.getElementById("pressed");

        function selectAction(action) {
            if (currentSequence.length < 4) {
                currentSequence.push(action);
            } else {
                alert("You already chose four options!")
                checkSequence();
            }
        }

        function equals(sequence1, sequence2) {
            let equals = true;
            if (sequence1.length != sequence2.length) {
                equals = false;
            } else {
                for (let i = 0; i < sequence1.length; i++) {
                    if (sequence1[i] !== (sequence2[i])) {
                        equals = false;
                    }
                }
            }
            return equals;
        }

        function checkSequence() {
            if (equals(currentSequence, correctSequence)) {
                alert("Congratulations, you successfully avoided detection!");
                document.location.replace("page6.html");
            } else {
                alert("Uh oh, you got caught! Try again!");
                reset();
            }
        }

        function reset() {
            currentSequence = [];
        }

        function onChoice(e) {
            choiceText.innerHTML = `You decided to ${e.innerHTML}!`;
        }
    </script>

</body>

</html>
