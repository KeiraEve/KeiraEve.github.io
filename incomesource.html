<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.9.0/dist/css/foundation.min.css" crossorigin="anonymous">
    <title>Income Source</title>
</head>
<body>
    <main>
        <h1>Add Income</h1>
        <form id="incomeForm">
            <label for="incomeName">Income Source Name: </label>
            <input type="text" name="incomeName" id="incomeName" placeholder="Enter your income source..." pattern="{3,}" required>

            <label for="amount">Amount: </label>
            <input type="text" name="amount" id="amount" placeholder="Enter your income amount..." pattern="">

            <label for="frequency">Frequency: </label>
            <select name="amount" id="amount">
                <option value="one-time">One-time</option>
                <option value="monthly">Monthly</option>
                <option value="bi-weekly">Bi-weekly</option>
                <option value="annually">Annually</option>
            </select>
        </form>
    </main>
</body>
</html>
