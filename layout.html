<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Layout</title>
    <style>
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }
        main {
            display: flex;
            flex-direction: column;
        }
        article {
            background-color: rgb(190, 247, 106);
            height: 20vh;
            flex-grow: 1;
            padding: 1em;
        }
        nav, aside {
            background-color: rgb(126, 76, 60);
            padding: 1em;
        }
        header, footer {
            background-color: rgb(255, 161, 200);
            height: 10vh;
            padding: 1em;
        }
        @media (min-width: 576px){
            main {
                flex-direction: row;
            }
            nav, aside {
                flex: 0 0 20vw;
            }
        }
    </style>
</head>
<body>
    <header>Header</header>
    
    <main>
        <nav>Nav</nav>
        <article>Article</article>
        <aside>Aside</aside>
    </main>

    <footer>Footer</footer>
</body>
</html>
